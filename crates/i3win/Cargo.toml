[package]
name = "i3win"
version = "0.2.0"
edition = "2021"

[dependencies]
i3win-core = { path = "../core" }
log = "0.4"
serde_json = "1"
simplelog = "0.12"
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_Accessibility","Win32_UI_Input_KeyboardAndMouse","Win32_UI_HiDpi","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_System_Threading","Win32_System_LibraryLoader","Win32_System_Console","Win32_Security","Win32_System_Pipes","Win32_Storage_FileSystem","Win32_System_IO","Win32_System_SystemServices","Win32_System_JobObjects","Win32_Globalization","Win32_System_Com","Win32_UI_Shell"]

[dev-dependencies]
i3win-core = { path = "../core" }
serde_json = "1"

[dev-dependencies.windows]
version = "0.58"
features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_Graphics_Gdi","Win32_Graphics_Dwm"]
